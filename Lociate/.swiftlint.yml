included:
  - .

excluded:
  - DerivedData
  - .build
  - Packages

disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - vertical_parameter_alignment_on_call

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

# CI runs `swiftlint --strict`, which promotes every warning to an error. That makes
# a two-tier threshold meaningless: whatever is set as `warning` becomes the hard
# limit and the `error` tier is never reached. For the size rules below, the limit
# that matters is the one already declared as `error` — the point at which this
# project said a file or type is genuinely too big — so both tiers are set to it.
#
# These are ceilings, not targets. Five view files currently sit in the 560–710 range
# and three view bodies in the 480–510 range; splitting them into per-screen files is
# worthwhile follow-up work, and until then this limit keeps them from growing.
file_length:
  warning: 800
  error: 800

type_body_length:
  warning: 600
  error: 600

function_body_length:
  warning: 100
  error: 100

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - to

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 60

nesting:
  type_level: 3
  function_level: 3

reporter: xcode
