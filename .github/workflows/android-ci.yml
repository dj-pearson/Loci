name: Android CI — Build, Lint & Test

# US-193: PRs target `master` here, not `main`. The path filter is kept off the
# pull_request trigger for the required-check note in LAUNCH_CHECKLIST.md — a
# required check that is skipped by a path filter blocks the merge queue.
on:
  push:
    branches: [master, 'claude/*', 'feature/*']
    paths: ['android/**', '.github/workflows/android-ci.yml']
  pull_request:
    branches: [master]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # Mirrors the iOS `Generate BuildSecrets.swift` step. Placeholders keep a fork
      # PR (which cannot read secrets) building; only android-release.yml requires
      # the real values.
      - name: Generate local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          CERT_PIN_HASH: ${{ secrets.CERT_PIN_HASH }}
          CERT_BACKUP_PIN_HASH: ${{ secrets.CERT_BACKUP_PIN_HASH }}
          REQUEST_SIGNING_KEY: ${{ secrets.REQUEST_SIGNING_KEY }}
        run: |
          export SUPABASE_URL="${SUPABASE_URL:-http://localhost:54321}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-ci-placeholder-anon-key}"
          export MAPS_API_KEY="${MAPS_API_KEY:-ci-placeholder-maps-key}"
          bash scripts/generate-secrets.sh --android

      # Advisory only: ktlint findings are reported but do not fail the job.
      - name: Run ktlint
        working-directory: android
        run: ./gradlew ktlintCheck --continue || true

      - name: Run Android Lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Generate local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          CERT_PIN_HASH: ${{ secrets.CERT_PIN_HASH }}
          CERT_BACKUP_PIN_HASH: ${{ secrets.CERT_BACKUP_PIN_HASH }}
          REQUEST_SIGNING_KEY: ${{ secrets.REQUEST_SIGNING_KEY }}
        run: |
          export SUPABASE_URL="${SUPABASE_URL:-http://localhost:54321}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-ci-placeholder-anon-key}"
          export MAPS_API_KEY="${MAPS_API_KEY:-ci-placeholder-maps-key}"
          bash scripts/generate-secrets.sh --android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
