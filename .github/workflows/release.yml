name: Release — App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g., 1.0.0)"
        required: true
        type: string
      whats_new:
        description: "What's new text for this release"
        required: false
        type: string
        default: "Bug fixes and performance improvements."

concurrency:
  group: release-appstore
  cancel-in-progress: false

jobs:
  release:
    name: Build & Submit to App Store
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate BuildSecrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
          CERT_PIN_HASH: ${{ secrets.CERT_PIN_HASH }}
          CERT_BACKUP_PIN_HASH: ${{ secrets.CERT_BACKUP_PIN_HASH }}
        run: |
          # A shipped build must have certificate pinning on. generate-secrets.sh
          # treats CERT_PIN_HASH as optional so a fork PR can still build, so the
          # requirement is asserted here, where it actually matters.
          if [ -z "${CERT_PIN_HASH:-}" ]; then
            echo "::error::CERT_PIN_HASH is not set. A release build must not ship with certificate pinning disabled."
            exit 1
          fi
          chmod +x scripts/generate-secrets.sh
          # --ios, not bare: in auto mode a missing iOS secret is only a skipped
          # platform, which would leave BuildSecrets.swift ungenerated and fail much
          # later with a confusing compile error.
          ./scripts/generate-secrets.sh --ios

      - name: Install Fastlane
        run: |
          gem install fastlane --no-document
          fastlane --version

      - name: Setup Match Certificates
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd Lociate
          fastlane match appstore --readonly

      - name: Set Version & Build Number
        run: |
          cd Lociate
          agvtool new-marketing-version ${{ inputs.version }}
          agvtool new-version -all ${{ github.run_number }}

      - name: Build & Submit to App Store
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_API_KEY }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd Lociate
          fastlane app_store_release version:"${{ inputs.version }}" whats_new:"${{ inputs.whats_new }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes "${{ inputs.whats_new }}" \
            --target "${{ github.sha }}"

      - name: Notify on Success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"Lociate v${{ inputs.version }} submitted to App Store review.\"}"
          fi

      - name: Notify on Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"Lociate v${{ inputs.version }} App Store release FAILED. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
