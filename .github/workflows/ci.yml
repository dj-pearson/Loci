name: CI — Build & Lint

on:
  push:
    branches:
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --config Loci/.swiftlint.yml --strict

  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    needs: swiftlint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -project Loci/Loci.xcodeproj \
            -scheme Loci \
            -resolvePackageDependencies

      - name: Build for Simulator
        run: |
          xcodebuild -project Loci/Loci.xcodeproj \
            -scheme Loci \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Unit Tests
    runs-on: macos-14
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -project Loci/Loci.xcodeproj \
            -scheme Loci \
            -resolvePackageDependencies

      - name: Run Unit Tests
        run: |
          xcodebuild -project Loci/Loci.xcodeproj \
            -scheme Loci \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/test-results.xcresult

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results.xcresult
          retention-days: 14

  web-build:
    name: Build Marketing Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
