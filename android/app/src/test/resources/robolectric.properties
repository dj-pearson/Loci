# Robolectric emulates targetSdk by default, and targetSdk here is 35. Robolectric
# 4.13 has no android-all jar that high, so DefaultSdkPicker threw
# "Package targetSdkVersion=35 > maxSdkVersion=..." and every Robolectric test failed
# with initializationError before a single assertion ran.
#
# Pinning the emulated SDK to 34 takes the explicitly-enumerated branch in
# DefaultSdkPicker instead of deriving it from targetSdk. Raise this — or delete the
# file — once Robolectric is upgraded to a version that ships API 35.
sdk=34
